<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1f22">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Test des capteurs</title>
<style>
  @font-face {
    font-family: "Bricolage";
    src: url("/fonts/bricolage.woff2") format("woff2");
    font-weight: 200 800;
    font-display: swap;
  }
  :root { --bg: #1d1f22; --paper: #f4f3ef; --soft: #9d9ea2; --accent: #c6f135; }
  body { margin: 0; padding: 20px 16px; background: var(--bg); color: var(--paper); font: 16px/1.45 "Bricolage", sans-serif; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  p { margin: 8px 0; }
  .soft { color: var(--soft); font-size: .85rem; overflow-wrap: anywhere; }
  #step { min-height: 4.5em; font-size: 1.15rem; }
  #count { font-size: 3rem; font-weight: 800; color: var(--accent); }
  button { font: inherit; font-weight: 700; padding: 12px 22px; border: 0; border-radius: 999px; background: var(--accent); color: #121314; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 4px; border-bottom: 1px solid #3a3c40; text-align: right; }
  th:first-child, td:first-child { text-align: left; color: var(--soft); font-weight: 400; }
</style>
</head>
<body>
<h1>Test des capteurs</h1>
<p class="soft">Mesure ce que le navigateur donne au pointeur de la manette. Une capture d'écran du résultat suffit.</p>
<p id="step"></p>
<p id="count"></p>
<button id="go">Démarrer</button>
<div id="out"></div>
<p class="soft" id="ua"></p>

<script type="module">
import { aimAngles, aimFusion } from './motion.mjs';

const RAD = Math.PI / 180;
const $ = (id) => document.getElementById(id);
$('ua').textContent = navigator.userAgent;

let rec = null;
let absolute = null;
addEventListener('deviceorientation', (e) => {
  if (!rec || e.alpha == null) return;
  absolute ??= e.absolute;
  rec.o.push([e.timeStamp, e.alpha, e.beta, e.gamma]);
});
addEventListener('devicemotion', (e) => {
  const r = e.rotationRate;
  if (!rec || r?.alpha == null) return;
  rec.m.push([e.timeStamp, r.alpha, r.beta, r.gamma, e.interval]);
});

const wait = (s) => new Promise((done) => {
  let left = s;
  const tick = () => {
    $('count').textContent = left || '';
    if (left-- <= 0) return done();
    setTimeout(tick, 1000);
  };
  tick();
});

async function record(text, seconds) {
  $('step').textContent = text;
  await wait(3);
  navigator.vibrate?.(60);
  // La vibration secoue le gyroscope : mesure après.
  await new Promise((done) => setTimeout(done, 300));
  $('step').textContent = 'Mesure en cours… ' + text;
  rec = { o: [], m: [] };
  await wait(seconds);
  const done = rec;
  rec = null;
  navigator.vibrate?.([60, 80, 60]);
  return done;
}

const mean = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;
const std = (xs) => Math.sqrt(mean(xs.map((x) => (x - mean(xs)) ** 2)));
const pct = (xs, p) => [...xs].sort((a, b) => a - b)[Math.min(xs.length - 1, Math.floor(p * xs.length))];
const wrap = (d) => ((((d + 180) % 360) + 360) % 360) - 180;
const seconds = (rows) => (rows.at(-1)[0] - rows[0][0]) / 1000;

// Fréquence des évènements, et celle des valeurs qui changent : la vraie cadence du capteur derrière.
function cadence(rows) {
  const dt = rows.slice(1).map((r, i) => r[0] - rows[i][0]);
  const fresh = rows.filter((r, i) => i === 0 || [1, 2, 3].some((k) => r[k] !== rows[i - 1][k])).length;
  const s = seconds(rows);
  return { hz: rows.length / s, fresh: fresh / s, p50: pct(dt, 0.5), p95: pct(dt, 0.95), max: Math.max(...dt) };
}

const forward = ([, a, b]) => [-Math.sin(a * RAD) * Math.cos(b * RAD), Math.cos(a * RAD) * Math.cos(b * RAD), Math.sin(b * RAD)];
const angle = (u, v) => Math.acos(Math.min(1, u[0] * v[0] + u[1] * v[1] + u[2] * v[2])) / RAD;

// En mouvement, chaque pas de l'orientation comparé à la rotation que mesure le gyroscope sur le même intervalle :
// un saut sans rotation, c'est la fusion du système. Chrome tait l'orientation qui bouge de moins de 0,1° : son
// rythme ne se juge que quand le téléphone tourne franchement (plus de 15 °/s, soit 0,25° toutes les 16 ms).
function jumps(o, m) {
  let j = 0;
  let sauts = 0;
  const moving = [];
  for (let i = 1; i < o.length; i++) {
    const [t0, t1] = [o[i - 1][0], o[i][0]];
    while (j < m.length - 1 && m[j][0] <= t0) j++;
    const rates = [];
    for (let k = j; k < m.length && m[k][0] <= t1; k++) rates.push(Math.hypot(m[k][1], m[k][2], m[k][3]));
    if (!rates.length) rates.push(Math.hypot(m[j][1], m[j][2], m[j][3]));
    const gyro = (mean(rates) * (t1 - t0)) / 1000;
    const moved = angle(forward(o[i - 1]), forward(o[i]));
    if (moved > 2 * gyro + 0.5) sauts++;
    if (mean(rates) > 15) moving.push(t1 - t0);
  }
  return {
    sauts: sauts / seconds(o),
    hz: moving.length / (moving.reduce((a, b) => a + b, 0) / 1000),
    p95: pct(moving, 0.95),
    max: Math.max(...moving),
  };
}

// La visée fusionnée de la manette, rejouée sur le balayage : le gyroscope est-il retenu ?
function fusionCheck(o, m) {
  const fusion = aimFusion();
  const events = [...o.map((r) => ['o', r]), ...m.map((r) => ['m', r])].sort((a, b) => a[1][0] - b[1][0]);
  for (const [kind, r] of events) {
    if (kind === 'o') fusion.orientation(r[1], r[2], r[3], r[0]);
    else fusion.gyro({ alpha: r[1], beta: r[2], gamma: r[3] }, r[0]);
  }
  return fusion.check;
}

// Au repos, Chrome peut ne donner aucune orientation (moins de 0,1° de changement) : rien à mesurer alors.
function rest(o, m) {
  const aims = o.length > 1 ? o.map(([, a, b]) => aimAngles(a, b, 0)) : [[NaN, NaN]];
  const yaw = aims.map(([h]) => wrap(h - aims[0][0]));
  const pitch = aims.map(([, e]) => e);
  const axes = [1, 2, 3].map((k) => m.map((r) => r[k]));
  return {
    noise: Math.max(std(yaw), std(pitch)),
    drift: o.length > 1 ? (yaw.at(-1) / seconds(o)) * 60 : NaN,
    gyroNoise: Math.max(...axes.map(std)),
    gyroBias: Math.max(...axes.map((xs) => Math.abs(mean(xs)))),
  };
}

const f = (v, d = 1) => (Number.isFinite(v) ? v.toFixed(d) : '—');

function show(still, sweep) {
  const r = rest(still.o, still.m);
  const co = cadence(sweep.o);
  const cm = cadence(sweep.m);
  const jm = jumps(sweep.o, sweep.m);
  const fc = fusionCheck(sweep.o, sweep.m);
  const verdict = fc.axes === undefined ? 'pas assez de mouvement' : fc.axes === null ? 'non' : 'oui';
  const accord = fc.results.map(({ cos, ratio }, i) => `${['xyz', 'spec'][i]} ${f(cos, 2)} × ${f(ratio, 2)}`);
  const rows = [
    ['Évènements par seconde', f(co.hz), f(cm.hz)],
    ['Valeurs nouvelles par seconde', f(co.fresh), f(cm.fresh)],
    ['Écart médian (ms)', f(co.p50), f(cm.p50)],
    ['Écart p95 (ms)', f(co.p95), f(cm.p95)],
    ['Écart max (ms)', f(co.max, 0), f(cm.max, 0)],
    ['Bruit au repos', f(r.noise, 3) + ' °', f(r.gyroNoise, 3) + ' °/s'],
    ['Dérive / biais au repos', f(r.drift, 2) + ' °/min', f(r.gyroBias, 3) + ' °/s'],
    ['Sauts par seconde', f(jm.sauts, 2), ''],
    ['En mouvement : par seconde', f(jm.hz), ''],
    ['En mouvement : écart p95 / max (ms)', `${f(jm.p95, 0)} / ${f(jm.max, 0)}`, ''],
    ['Gyroscope suivi par la visée', '', verdict],
    [`Accord sur ${fc.windows} rotations de 4° (sens × ampleur)`, '', accord.join('<br>') || '—'],
  ];
  $('out').innerHTML = '<table><tr><th></th><th>Orientation</th><th>Gyroscope</th></tr>' +
    rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('') + '</table>';
  $('step').textContent = `Terminé. Orientation ${absolute ? 'absolue (boussole)' : 'relative'}, ` +
    `intervalle annoncé ${f(sweep.m[0]?.[4], 1)} ms. Fais une capture d'écran.`;
}

$('go').addEventListener('click', async () => {
  const asks = [DeviceMotionEvent, DeviceOrientationEvent]
    .filter((E) => typeof E?.requestPermission === 'function')
    .map((E) => E.requestPermission().catch(() => 'denied'));
  if ((await Promise.all(asks)).includes('denied')) {
    $('step').textContent = 'Mouvements refusés : autorise-les dans les réglages du navigateur, puis recharge.';
    return;
  }
  $('go').hidden = true;
  $('out').innerHTML = '';
  absolute = null;
  const still = await record('Pose le téléphone à plat sur une table et ne le touche plus.', 5);
  const sweep = await record(
    "Prends-le comme la manette, pointé vers l'écran, et vise partout comme dans un menu : gauche, droite, haut, bas.", 12);
  $('count').textContent = '';
  $('go').hidden = false;
  $('go').textContent = 'Recommencer';
  if (still.m.length < 10 || sweep.o.length < 10 || sweep.m.length < 10) {
    $('step').textContent = `Pas assez de mesures (orientation ${sweep.o.length}, gyroscope ${sweep.m.length}) : ` +
      'le navigateur ne donne pas les capteurs.';
    return;
  }
  show(still, sweep);
});
</script>
</body>
</html>
