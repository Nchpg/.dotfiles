<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Wiimote</title>
<style>
  @font-face {
    font-family: "Bricolage";
    src: url("/fonts/bricolage.woff2") format("woff2");
    font-weight: 200 800;
    font-display: swap;
  }

  :root {
    --bg: #1d1f22;
    --body: #f7f7f4;
    --body-edge: #d9d9d3;
    --btn: #e8e8e3;
    --btn-edge: #c4c4bd;
    --btn-on: #c9c9c2;
    --ink: #8d8e89;
    --home: #2f8ad8;
    --led: #36a3ff;
    --led-off: #cfd6dc;
    /* Écran de connexion : mêmes couleurs que la page de l'hôte. */
    --paper: #f4f3ef;
    --paper-ink: #121314;
    --paper-soft: #6b6c70;
    --accent: #c6f135;
    /* Unité de la manette : le vmin d'un téléphone (écran d'environ 2,1:1 ou plus allongé). Sur un écran plus
       carré (tablette), la longueur la borne aussi : sinon tout déborde en largeur. */
    --u: min(1vmin, calc(1vmax / 2.1));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000;
      --body: #1c1c1e;
      --body-edge: #2c2c2f;
      --btn: #2e2e31;
      --btn-edge: #121214;
      --btn-on: #45454a;
      --ink: #9a9a9e;
      --led-off: #2a3138;
      --paper: #0f1012;
      --paper-ink: #f1f0eb;
      --paper-soft: #8d8e93;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000; --body: #1c1c1e; --body-edge: #2c2c2f; --btn: #2e2e31;
    --btn-edge: #121214; --btn-on: #45454a; --ink: #9a9a9e; --led-off: #2a3138;
    --paper: #0f1012; --paper-ink: #f1f0eb; --paper-soft: #8d8e93;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font: 600 16px/1 system-ui, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Scène tournée par app.mjs pour rester fixe par rapport au téléphone, quelle que soit la rotation de l'écran. */
  .stage {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 100vw;
    height: 100vh;
    padding: 3vmin;
    transform: translate(-50%, -50%);
  }

  /* Wiimote debout : de haut en bas, dans l'ordre de la vraie. */
  .remote {
    position: relative;
    height: 100%;
    max-width: calc(100 * var(--u));
    margin: 0 auto;
    border-radius: calc(9 * var(--u));
    background: var(--body);
    box-shadow: inset 0 0 0 1px var(--body-edge), inset 0 calc(-1.5 * var(--u)) calc(3 * var(--u)) rgb(0 0 0 / .08);
    display: grid;
    gap: calc(2 * var(--u));
    padding: calc(5 * var(--u)) calc(4 * var(--u));
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 3fr 1.6fr 1.3fr 1fr 1.4fr 1.4fr .4fr .7fr;
    grid-template-areas:
      "dpad  dpad dpad"
      "a     a    a"
      "b     b    b"
      "minus home plus"
      "one   one  one"
      "two   two  two"
      "leds  leds leds"
      "shake .    rec";
  }
  button {
    font: inherit;
    color: var(--ink);
    border: 0;
    padding: 0;
    background: var(--btn);
    box-shadow: 0 calc(.6 * var(--u)) 0 var(--btn-edge), 0 calc(.8 * var(--u)) calc(1.6 * var(--u)) rgb(0 0 0 / .18);
    place-self: center;
    transition: transform 40ms, box-shadow 40ms, background 40ms;
  }
  button.on {
    background: var(--btn-on);
    transform: translateY(calc(.5 * var(--u)));
    box-shadow: 0 calc(.1 * var(--u)) 0 var(--btn-edge), 0 calc(.2 * var(--u)) calc(.6 * var(--u)) rgb(0 0 0 / .2);
  }

  .dpad {
    grid-area: dpad;
    place-self: center;
    display: grid;
    grid-template: repeat(3, calc(14 * var(--u))) / repeat(3, calc(14 * var(--u)));
    /* Une ombre pour toute la croix : celle de chaque flèche tombait sur le centre (trait sous le haut). */
    filter: drop-shadow(0 calc(.6 * var(--u)) 0 var(--btn-edge));
  }
  .dpad button { width: 100%; height: 100%; border-radius: calc(1.5 * var(--u)); box-shadow: none; }
  .dpad button.on { transform: none; box-shadow: none; }
  /* Déborde sous les flèches : sans quoi un liseré du fond passe entre elles et le centre (pixels fractionnaires). */
  .dpad::before { content: ""; grid-area: 2 / 2; margin: -1px; background: var(--btn); }
  .dpad [data-dir="up"] { grid-area: 1 / 2; border-radius: calc(1.5 * var(--u)) calc(1.5 * var(--u)) 0 0; }
  .dpad [data-dir="left"] { grid-area: 2 / 1; border-radius: calc(1.5 * var(--u)) 0 0 calc(1.5 * var(--u)); }
  .dpad [data-dir="right"] { grid-area: 2 / 3; border-radius: 0 calc(1.5 * var(--u)) calc(1.5 * var(--u)) 0; }
  .dpad [data-dir="down"] { grid-area: 3 / 2; border-radius: 0 0 calc(1.5 * var(--u)) calc(1.5 * var(--u)); }
  .dpad button::after { content: ""; display: block; margin: auto; border: calc(2 * var(--u)) solid transparent; width: 0; height: 0; }
  .dpad [data-dir="up"]::after { border-bottom-color: var(--ink); margin-top: calc(2 * var(--u)); }
  .dpad [data-dir="down"]::after { border-top-color: var(--ink); margin-bottom: calc(2 * var(--u)); }
  .dpad [data-dir="left"]::after { border-right-color: var(--ink); margin-left: calc(2 * var(--u)); }
  .dpad [data-dir="right"]::after { border-left-color: var(--ink); margin-right: calc(2 * var(--u)); }

  .a { grid-area: a; width: calc(25 * var(--u)); height: calc(25 * var(--u)); border-radius: 50%; font-size: calc(9 * var(--u)); }
  .b {
    grid-area: b;
    width: 55%;
    height: 85%;
    border-radius: calc(6 * var(--u));
    font-size: calc(8 * var(--u));
    background: color-mix(in srgb, var(--btn) 82%, #000);
  }
  .b.on { background: color-mix(in srgb, var(--btn) 68%, #000); }
  .minus, .plus, .home { width: calc(12 * var(--u)); height: calc(12 * var(--u)); border-radius: 50%; font-size: calc(7 * var(--u)); }
  .minus { grid-area: minus; }
  .plus { grid-area: plus; }
  .home { grid-area: home; color: var(--home); }
  .home svg { width: calc(6 * var(--u)); height: calc(6 * var(--u)); display: block; margin: auto; fill: currentColor; }
  .one, .two { width: calc(24 * var(--u)); height: calc(24 * var(--u)); border-radius: 50%; font-size: calc(9 * var(--u)); }
  .one { grid-area: one; }
  .two { grid-area: two; }
  .recenter, .shake { width: calc(24 * var(--u)); height: calc(9 * var(--u)); border-radius: calc(4.5 * var(--u)); font-size: calc(6 * var(--u)); }
  .recenter { grid-area: rec; }
  .shake { grid-area: shake; }
  .shake svg { width: calc(6 * var(--u)); height: calc(6 * var(--u)); display: block; margin: auto; }

  .leds { grid-area: leds; place-self: center; display: flex; gap: calc(2.4 * var(--u)); }
  .leds i { width: calc(3.6 * var(--u)); height: calc(2 * var(--u)); border-radius: calc(.6 * var(--u)); background: var(--led-off); }
  .leds i.on { background: var(--led); box-shadow: 0 0 calc(2 * var(--u)) var(--led); }
  /* Liaison coupée, reconnexion en cours : les diodes clignotent, comme une vraie Wiimote qui cherche. */
  .searching .leds i { animation: searching 1s steps(1) infinite; }
  @keyframes searching { 50% { background: var(--led); box-shadow: 0 0 calc(2 * var(--u)) var(--led); } }

  /* Changement de tenue et de thème, dans le coin où le pouce ne passe pas. */
  .mode, .theme, .pad, .settings {
    position: absolute;
    top: calc(3.5 * var(--u));
    right: calc(3.5 * var(--u));
    width: calc(10 * var(--u));
    height: calc(10 * var(--u));
    border-radius: 50%;
  }
  .theme { right: calc(15.5 * var(--u)); }
  /* Réglages et croix/joystick : à gauche à la verticale, où la croix (ou le joystick) laisse le coin libre. */
  .settings { right: auto; left: calc(3.5 * var(--u)); }
  .pad { right: auto; left: calc(15.5 * var(--u)); }
  .mode svg, .theme svg, .pad svg, .settings svg { width: calc(5.5 * var(--u)); height: calc(5.5 * var(--u)); display: block; margin: auto; fill: currentColor; }

  /* Joystick, à la place de la croix (bouton en haut) : le pouce glisse, la croix sort de la même manière. */
  .joystick {
    grid-area: dpad;
    place-self: center;
    display: none;
    position: relative;
    width: calc(40 * var(--u));
    aspect-ratio: 1;
    border-radius: 50%;
    background: color-mix(in srgb, var(--btn) 55%, var(--body));
    box-shadow: inset 0 calc(.6 * var(--u)) calc(1.6 * var(--u)) rgb(0 0 0 / .14);
  }
  .joystick i {
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: var(--btn);
    box-shadow: 0 calc(.6 * var(--u)) 0 var(--btn-edge), 0 calc(.8 * var(--u)) calc(1.6 * var(--u)) rgb(0 0 0 / .18);
  }
  .stick .dpad { display: none; }
  .stick .joystick { display: block; }
  /* Icône du mode en cours (croix, joystick, volant). */
  .pad svg { display: none; }
  body:not(.stick) .pad .for-dpad, .stick:not(.wheel) .pad .for-stick, .wheel .pad .for-wheel { display: block; }

  /* Wiimote de côté (Mario Kart) : la croix à gauche, B sous le pouce gauche, 1 au-dessus de 2 sous le pouce
     droit : empilés, ils libèrent une colonne pour grossir le reste. Après les règles de base, qu'il remplace. */
  .sideways .remote {
    max-width: none;
    grid-template-columns: 2fr 1.2fr .7fr 1.4fr .3fr;
    grid-template-rows: repeat(6, 1fr);
    grid-template-areas:
      "dpad a     plus  one leds"
      "dpad a     plus  one leds"
      "dpad shake home  one leds"
      "dpad shake home  two leds"
      "b    b     minus two leds"
      "b    b     minus two leds";
  }
  .sideways .recenter { display: none; }
  /* De côté (croix à gauche), le flanc gauche de la Wiimote debout, celui de la diode 1, passe en bas. */
  .sideways .leds { flex-direction: column-reverse; align-self: end; }
  /* Réglages empilés sur le bord droit : la colonne de 1 et 2 monte jusqu'en haut. */
  .sideways .theme { right: calc(3.5 * var(--u)); top: calc(15.5 * var(--u)); }
  .sideways .pad { left: auto; right: calc(3.5 * var(--u)); top: calc(27.5 * var(--u)); }
  .sideways .settings { left: auto; right: calc(3.5 * var(--u)); top: calc(39.5 * var(--u)); }
  .sideways .a { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
  .sideways .b { width: 90%; height: 78%; }
  .sideways .minus, .sideways .plus, .sideways .home { width: calc(14 * var(--u)); height: calc(14 * var(--u)); }
  /* Secouer (figure, saut) : sous le pouce gauche, libre quand le droit tient 2 pour accélérer. */
  .sideways .shake { width: calc(23 * var(--u)); height: calc(23 * var(--u)); border-radius: 50%; }
  .sideways .shake svg { width: calc(10 * var(--u)); height: calc(10 * var(--u)); }
  .sideways .one, .sideways .two { width: calc(39 * var(--u)); height: calc(39 * var(--u)); font-size: calc(13 * var(--u)); }
  /* Croix plus grande à l'horizontale, où elle sert à se déplacer (Mario). */
  .sideways .dpad { grid-template: repeat(3, calc(18 * var(--u))) / repeat(3, calc(18 * var(--u))); }
  .sideways .joystick { width: calc(55 * var(--u)); }
  /* Option « B à côté de A » : B sous Secouer, la croix (ou le joystick) seule à gauche, centrée et agrandie. */
  body.sideways.b-by-a .remote {
    grid-template-areas:
      "dpad a     plus  one leds"
      "dpad a     plus  one leds"
      "dpad shake home  one leds"
      "dpad shake home  two leds"
      "dpad b     minus two leds"
      "dpad b     minus two leds";
  }
  /* À côté de A, B garde sa forme large mais prend la couleur des boutons de face. */
  .sideways.b-by-a .b { width: 92%; height: 70%; background: var(--btn); }
  .sideways.b-by-a .b.on { background: var(--btn-on); }
  .sideways.b-by-a .dpad { grid-template: repeat(3, calc(20 * var(--u))) / repeat(3, calc(20 * var(--u))); }
  .sideways.b-by-a .joystick { width: calc(62 * var(--u)); }

  /* Panneau des réglages (⚙), dans la scène comme l'écran d'accueil. */
  .panel {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    padding: 1.5rem;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    font-family: "Bricolage", system-ui, sans-serif;
    touch-action: manipulation;
  }
  .panel[hidden] { display: none; }
  .panel form {
    display: grid;
    gap: 1.1rem;
    width: min(88vw, 24rem);
    padding: 1.4rem 1.5rem;
    border-radius: 18px;
    background: var(--paper);
    color: var(--paper-ink);
    box-shadow: 0 1rem 3rem rgb(0 0 0 / .35);
  }
  .panel h2 { margin: 0; font-size: 1.4rem; font-weight: 760; letter-spacing: -.02em; }
  .panel label { display: grid; gap: .45rem; font-weight: 500; }
  .panel label span { display: flex; justify-content: space-between; gap: 1rem; }
  .panel label small { color: var(--paper-soft); font-weight: 400; }
  .panel output { font-variant-numeric: tabular-nums; font-weight: 700; }
  .panel .check { grid-template-columns: auto 1fr; align-items: center; column-gap: .7rem; }
  .panel input { accent-color: var(--accent); }
  .panel input[type="checkbox"] { width: 1.3rem; height: 1.3rem; margin: 0; }
  .panel input[type="range"] { width: 100%; margin: 0; }
  .panel .link { margin: 0; color: var(--paper-soft); font-size: .9rem; }
  .panel .start.quiet { background: transparent; border: 1px solid color-mix(in srgb, var(--paper-ink) 18%, transparent); color: var(--paper-ink); }
  /* Trop court pour tout tenir : le panneau défile (lui seul, malgré le touch-action du corps). */
  .panel { overflow-y: auto; place-content: safe center; touch-action: pan-y; }
  /* De côté, la hauteur manque (titre et OK sortaient de l'écran) : deux colonnes. */
  .sideways .panel { padding: 1rem; }
  .sideways .panel form { display: block; columns: 2; column-gap: 1.6rem; width: min(100%, 44rem); }
  .sideways .panel form > * { break-inside: avoid; margin: 0 0 1rem; }
  .sideways .panel form > :last-child { margin-bottom: 0; }
  .sideways .panel .start:not([hidden]) { display: block; margin-inline: auto; }

  /* Hors de la scène, dans le vrai sens de l'écran : celui du clavier qui s'ouvre pour le prénom. */
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 1.2rem;
    padding: 1.5rem;
    text-align: center;
    background: var(--paper);
    font-family: "Bricolage", system-ui, sans-serif;
    color: var(--paper-ink);
    touch-action: manipulation;
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 2.6rem; font-weight: 760; line-height: .95; letter-spacing: -.04em; }
  .overlay h1 i { font-style: normal; color: var(--accent); }
  .overlay p { margin: 0; max-width: 22rem; color: var(--paper-soft); font-weight: 400; line-height: 1.5; }
  .overlay .start, .panel .start {
    justify-self: center;
    min-width: 13rem;
    padding: .95rem 2rem;
    border-radius: 12px;
    background: var(--accent);
    color: #121314;
    box-shadow: none;
    font-size: 1.05rem;
    font-weight: 700;
    transform: none;
  }
  .overlay .start:active { transform: scale(.96); }
  .overlay .start[hidden], .overlay video[hidden], .overlay .name[hidden] { display: none; }
  .overlay .name {
    justify-self: center;
    width: min(100%, 15rem);
    padding: .8rem 1rem;
    border: 1px solid color-mix(in srgb, var(--paper-ink) 18%, transparent);
    border-radius: 12px;
    background: transparent;
    color: var(--paper-ink);
    font: 500 1.05rem "Bricolage", system-ui, sans-serif;
    text-align: center;
    user-select: text;
    -webkit-user-select: text;
  }
  .overlay .name:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .overlay video {
    justify-self: center;
    width: min(70vmin, 22rem);
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 16px;
    background: #000;
  }
  /* À l'horizontale, la hauteur manque : la caméra passe à gauche du texte. */
  @media (orientation: landscape) {
    .overlay:has(> video:not([hidden])) {
      grid-template-columns: auto minmax(0, 22rem);
      column-gap: 2rem;
      align-items: center;
    }
    .overlay video { grid-column: 1; grid-row: 1 / span 3; width: min(62vmin, 22rem); }
  }
</style>
<script type="module" src="app.mjs"></script>
</head>
<body>
<div class="stage" id="stage">
  <main class="remote">
    <button class="theme" id="theme" aria-label="Thème clair ou sombre">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2v14a7 7 0 0 1 0-14z"/></svg>
    </button>
    <button class="mode" id="mode" aria-label="Passer de la tenue horizontale à la verticale">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    </button>
    <button class="settings" id="settings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
    </button>
    <button class="pad" id="pad" aria-label="Croix, joystick ou volant">
      <svg class="for-dpad" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>
      <svg class="for-stick" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
      <svg class="for-wheel" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3.5 11.5h17M12 14v7"/><circle cx="12" cy="12" r="2.4"/></g></svg>
    </button>
    <div class="dpad" role="group" aria-label="Croix directionnelle">
      <button data-dir="up" aria-label="Haut"></button>
      <button data-dir="left" aria-label="Gauche"></button>
      <button data-dir="right" aria-label="Droite"></button>
      <button data-dir="down" aria-label="Bas"></button>
    </div>
    <div class="joystick" id="joystick" aria-label="Joystick"><i></i></div>
    <button class="a" data-btn="A">A</button>
    <button class="b" data-btn="B">B</button>
    <button class="minus" data-btn="-" aria-label="Moins">−</button>
    <button class="home" data-btn="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
    </button>
    <button class="plus" data-btn="+" aria-label="Plus">+</button>
    <button class="one" data-btn="1">1</button>
    <button class="two" data-btn="2">2</button>
    <button class="shake" data-btn="Shake" aria-label="Secouer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12l3-5 4 10 4-10 4 10 3-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="leds" aria-label="Numéro de joueur"><i></i><i></i><i></i><i></i></div>
    <button class="recenter" id="aim" aria-label="Calibrer le pointeur aux coins de l'écran, puis le recentrer">⌖</button>
  </main>

  <div class="panel" id="panel" hidden>
    <form id="settingsForm">
      <h2>Réglages</h2>
      <label class="check"><input type="checkbox" id="bByA"><span>B à côté de A <small>croix seule à gauche</small></span></label>
      <label>
        <span>Inclinaison pour tourner <output id="tiltOut"></output></span>
        <input type="range" id="tilt" min="0.5" max="2" step="0.1">
      </label>
      <label>
        <span>Joystick en mode volant <output id="stickOut"></output></span>
        <input type="range" id="stick" min="0.5" max="2" step="0.1">
      </label>
      <label>
        <span>Lissage du pointeur <output id="smoothOut"></output></span>
        <input type="range" id="smooth" min="0" max="3" step="1">
      </label>
      <button class="start quiet" id="calibrate" type="button">Calibrer le pointeur</button>
      <p class="link">Vise chaque coin de la télé (↖ ↗ ↘ ↙) et appuie sur ⌖. Ensuite, ⌖ recentre : vise le milieu de l'écran et appuie.</p>
      <p class="link">Liaison : <b id="link">par Cloudflare (WebSocket)</b></p>
      <button class="start quiet" id="install" type="button" hidden>Installer l'application</button>
      <p class="link" id="installHint" hidden></p>
      <button class="start" id="closeSettings" type="button">OK</button>
    </form>
  </div>
</div>

<div class="overlay" id="overlay">
  <h1>Wiimote<i>.</i></h1>
  <p id="status">Tenue horizontale pour Mario Kart. Le bouton ⟲ en haut à droite passe à la verticale, pour pointer l'écran.</p>
  <video id="camera" playsinline muted hidden></video>
  <input id="name" class="name" maxlength="24" placeholder="Ton prénom" autocomplete="nickname" enterkeyhint="go" aria-label="Ton prénom, affiché à l'hôte" hidden>
  <button class="start" id="start">Connecter</button>
  <button class="start" id="scan" hidden>Scanner le QR code</button>
</div>
</body>
</html>
