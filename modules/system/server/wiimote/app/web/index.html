<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Wiimote</title>
<style>
  @font-face {
    font-family: "Bricolage";
    src: url("/fonts/bricolage.woff2") format("woff2");
    font-weight: 200 800;
    font-display: swap;
  }

  :root {
    --bg: #1d1f22;
    --body: #f7f7f4;
    --body-edge: #d9d9d3;
    --btn: #e8e8e3;
    --btn-edge: #c4c4bd;
    --btn-on: #c9c9c2;
    --ink: #8d8e89;
    --home: #2f8ad8;
    --led: #36a3ff;
    --led-off: #cfd6dc;
    /* Écran de connexion : mêmes couleurs que la page de l'hôte. */
    --paper: #f4f3ef;
    --paper-ink: #121314;
    --paper-soft: #6b6c70;
    --accent: #c6f135;
    /* Unité de la manette : le vmin d'un téléphone (écran d'environ 2,1:1 ou plus allongé). Sur un écran plus
       carré (tablette), la longueur la borne aussi : sinon tout déborde en largeur. */
    --u: min(1vmin, calc(1vmax / 2.1));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000;
      --body: #1c1c1e;
      --body-edge: #2c2c2f;
      --btn: #2e2e31;
      --btn-edge: #121214;
      --btn-on: #45454a;
      --ink: #9a9a9e;
      --led-off: #2a3138;
      --paper: #0f1012;
      --paper-ink: #f1f0eb;
      --paper-soft: #8d8e93;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000; --body: #1c1c1e; --body-edge: #2c2c2f; --btn: #2e2e31;
    --btn-edge: #121214; --btn-on: #45454a; --ink: #9a9a9e; --led-off: #2a3138;
    --paper: #0f1012; --paper-ink: #f1f0eb; --paper-soft: #8d8e93;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font: 600 16px/1 system-ui, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Scène tournée par app.mjs pour rester fixe par rapport au téléphone, quelle que soit la rotation de l'écran. */
  .stage {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 100vw;
    height: 100vh;
    padding: 3vmin;
    transform: translate(-50%, -50%);
  }

  /* Wiimote debout : de haut en bas, dans l'ordre de la vraie. */
  .remote {
    position: relative;
    height: 100%;
    max-width: calc(100 * var(--u));
    margin: 0 auto;
    border-radius: calc(9 * var(--u));
    background: var(--body);
    box-shadow: inset 0 0 0 1px var(--body-edge), inset 0 calc(-1.5 * var(--u)) calc(3 * var(--u)) rgb(0 0 0 / .08);
    display: grid;
    gap: calc(2 * var(--u));
    padding: calc(5 * var(--u)) calc(4 * var(--u));
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 3fr 1.6fr 1.3fr 1fr 1.4fr 1.4fr .4fr .7fr;
    grid-template-areas:
      "dpad  dpad dpad"
      "a     a    a"
      "b     b    b"
      "minus home plus"
      "one   one  one"
      "two   two  two"
      "leds  leds leds"
      "shake .    rec";
  }
  button {
    font: inherit;
    color: var(--ink);
    border: 0;
    padding: 0;
    background: var(--btn);
    box-shadow: 0 calc(.6 * var(--u)) 0 var(--btn-edge), 0 calc(.8 * var(--u)) calc(1.6 * var(--u)) rgb(0 0 0 / .18);
    place-self: center;
    transition: transform 40ms, box-shadow 40ms, background 40ms;
  }
  button.on {
    background: var(--btn-on);
    transform: translateY(calc(.5 * var(--u)));
    box-shadow: 0 calc(.1 * var(--u)) 0 var(--btn-edge), 0 calc(.2 * var(--u)) calc(.6 * var(--u)) rgb(0 0 0 / .2);
  }

  .dpad {
    grid-area: dpad;
    place-self: center;
    display: grid;
    grid-template: repeat(3, calc(14 * var(--u))) / repeat(3, calc(14 * var(--u)));
    /* Une ombre pour toute la croix : celle de chaque flèche tombait sur le centre (trait sous le haut). */
    filter: drop-shadow(0 calc(.6 * var(--u)) 0 var(--btn-edge));
  }
  .dpad button { width: 100%; height: 100%; border-radius: calc(1.5 * var(--u)); box-shadow: none; }
  .dpad button.on { transform: none; box-shadow: none; }
  /* Déborde sous les flèches : sans quoi un liseré du fond passe entre elles et le centre (pixels fractionnaires). */
  .dpad::before { content: ""; grid-area: 2 / 2; margin: -1px; background: var(--btn); }
  .dpad [data-dir="up"] { grid-area: 1 / 2; border-radius: calc(1.5 * var(--u)) calc(1.5 * var(--u)) 0 0; }
  .dpad [data-dir="left"] { grid-area: 2 / 1; border-radius: calc(1.5 * var(--u)) 0 0 calc(1.5 * var(--u)); }
  .dpad [data-dir="right"] { grid-area: 2 / 3; border-radius: 0 calc(1.5 * var(--u)) calc(1.5 * var(--u)) 0; }
  .dpad [data-dir="down"] { grid-area: 3 / 2; border-radius: 0 0 calc(1.5 * var(--u)) calc(1.5 * var(--u)); }
  .dpad button::after { content: ""; display: block; margin: auto; border: calc(2 * var(--u)) solid transparent; width: 0; height: 0; }
  .dpad [data-dir="up"]::after { border-bottom-color: var(--ink); margin-top: calc(2 * var(--u)); }
  .dpad [data-dir="down"]::after { border-top-color: var(--ink); margin-bottom: calc(2 * var(--u)); }
  .dpad [data-dir="left"]::after { border-right-color: var(--ink); margin-left: calc(2 * var(--u)); }
  .dpad [data-dir="right"]::after { border-left-color: var(--ink); margin-right: calc(2 * var(--u)); }

  .a { grid-area: a; width: calc(25 * var(--u)); height: calc(25 * var(--u)); border-radius: 50%; font-size: calc(9 * var(--u)); }
  .b {
    grid-area: b;
    width: 55%;
    height: 85%;
    border-radius: calc(6 * var(--u));
    font-size: calc(8 * var(--u));
    background: color-mix(in srgb, var(--btn) 82%, #000);
  }
  .b.on { background: color-mix(in srgb, var(--btn) 68%, #000); }
  .minus, .plus, .home { width: calc(12 * var(--u)); height: calc(12 * var(--u)); border-radius: 50%; font-size: calc(7 * var(--u)); }
  .minus { grid-area: minus; }
  .plus { grid-area: plus; }
  .home { grid-area: home; color: var(--home); }
  .home svg { width: calc(6 * var(--u)); height: calc(6 * var(--u)); display: block; margin: auto; fill: currentColor; }
  .one, .two { width: calc(24 * var(--u)); height: calc(24 * var(--u)); border-radius: 50%; font-size: calc(9 * var(--u)); }
  .one { grid-area: one; }
  .two { grid-area: two; }
  .recenter, .shake { width: calc(24 * var(--u)); height: calc(9 * var(--u)); border-radius: calc(4.5 * var(--u)); font-size: calc(6 * var(--u)); }
  .recenter { grid-area: rec; }
  .shake { grid-area: shake; }
  .shake svg { width: calc(6 * var(--u)); height: calc(6 * var(--u)); display: block; margin: auto; }

  .leds { grid-area: leds; place-self: center; display: flex; gap: calc(2.4 * var(--u)); }
  .leds i { width: calc(3.6 * var(--u)); height: calc(2 * var(--u)); border-radius: calc(.6 * var(--u)); background: var(--led-off); }
  .leds i.on { background: var(--led); box-shadow: 0 0 calc(2 * var(--u)) var(--led); }

  /* Changement de tenue et de thème, dans le coin où le pouce ne passe pas. */
  .mode, .theme, .pad {
    position: absolute;
    top: calc(3.5 * var(--u));
    right: calc(3.5 * var(--u));
    width: calc(10 * var(--u));
    height: calc(10 * var(--u));
    border-radius: 50%;
  }
  .theme { right: calc(15.5 * var(--u)); }
  .pad { right: calc(27.5 * var(--u)); }
  .mode svg, .theme svg, .pad svg { width: calc(5.5 * var(--u)); height: calc(5.5 * var(--u)); display: block; margin: auto; fill: currentColor; }

  /* Joystick, à la place de la croix (bouton en haut) : le pouce glisse, la croix sort de la même manière. */
  .joystick {
    grid-area: dpad;
    place-self: center;
    display: none;
    position: relative;
    width: calc(40 * var(--u));
    aspect-ratio: 1;
    border-radius: 50%;
    background: color-mix(in srgb, var(--btn) 55%, var(--body));
    box-shadow: inset 0 calc(.6 * var(--u)) calc(1.6 * var(--u)) rgb(0 0 0 / .14);
  }
  .joystick i {
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: var(--btn);
    box-shadow: 0 calc(.6 * var(--u)) 0 var(--btn-edge), 0 calc(.8 * var(--u)) calc(1.6 * var(--u)) rgb(0 0 0 / .18);
  }
  .stick .dpad { display: none; }
  .stick .joystick { display: block; }

  /* Wiimote de côté (Mario Kart) : la croix à gauche, B sous le pouce gauche, 1 et 2 sous le pouce droit.
     Après les règles de base, qu'il remplace. */
  .sideways .remote {
    max-width: none;
    grid-template-columns: 1.7fr 1fr .7fr 1.2fr 1.2fr .3fr;
    grid-template-rows: 1fr 1fr 1fr;
    grid-template-areas:
      "dpad a     plus  one two leds"
      "dpad shake home  one two leds"
      "b    b     minus one two leds";
  }
  .sideways .recenter { display: none; }
  /* De côté (croix à gauche), le flanc gauche de la Wiimote debout, celui de la diode 1, passe en bas. */
  .sideways .leds { flex-direction: column-reverse; }
  .sideways .b { width: 88%; height: 70%; }
  /* Secouer (figure, saut) : sous le pouce gauche, libre quand le droit tient 2 pour accélérer. */
  .sideways .shake { width: calc(20 * var(--u)); height: calc(20 * var(--u)); border-radius: 50%; }
  .sideways .shake svg { width: calc(9 * var(--u)); height: calc(9 * var(--u)); }
  .sideways .one, .sideways .two { width: calc(32 * var(--u)); height: calc(32 * var(--u)); font-size: calc(11 * var(--u)); }
  /* Croix plus grande à l'horizontale, où elle sert à se déplacer (Mario). */
  .sideways .dpad { grid-template: repeat(3, calc(17 * var(--u))) / repeat(3, calc(17 * var(--u))); }
  .sideways .joystick { width: calc(50 * var(--u)); }

  /* Dans la scène : tourne avec elle. */
  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 1.2rem;
    padding: 1.5rem;
    text-align: center;
    background: var(--paper);
    font-family: "Bricolage", system-ui, sans-serif;
    color: var(--paper-ink);
    touch-action: manipulation;
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 2.6rem; font-weight: 760; line-height: .95; letter-spacing: -.04em; }
  .overlay h1 i { font-style: normal; color: var(--accent); }
  .overlay p { margin: 0; max-width: 22rem; color: var(--paper-soft); font-weight: 400; line-height: 1.5; }
  .overlay .start {
    justify-self: center;
    min-width: 13rem;
    padding: .95rem 2rem;
    border-radius: 12px;
    background: var(--accent);
    color: #121314;
    box-shadow: none;
    font-size: 1.05rem;
    font-weight: 700;
    transform: none;
  }
  .overlay .start:active { transform: scale(.96); }
  .overlay .start[hidden], .overlay video[hidden], .overlay .name[hidden] { display: none; }
  .overlay .name {
    justify-self: center;
    width: min(100%, 15rem);
    padding: .8rem 1rem;
    border: 1px solid color-mix(in srgb, var(--paper-ink) 18%, transparent);
    border-radius: 12px;
    background: transparent;
    color: var(--paper-ink);
    font: 500 1.05rem "Bricolage", system-ui, sans-serif;
    text-align: center;
    user-select: text;
    -webkit-user-select: text;
  }
  .overlay .name:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .overlay video {
    justify-self: center;
    width: min(70vmin, 22rem);
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 16px;
    background: #000;
  }
  /* À l'horizontale, la hauteur manque : la caméra passe à gauche du texte. */
  .sideways .overlay:has(> video:not([hidden])) {
    grid-template-columns: auto minmax(0, 22rem);
    column-gap: 2rem;
    align-items: center;
  }
  .sideways .overlay video { grid-column: 1; grid-row: 1 / span 3; width: min(62vmin, 22rem); }
</style>
<script type="module" src="app.mjs"></script>
</head>
<body>
<div class="stage" id="stage">
  <main class="remote">
    <button class="theme" id="theme" aria-label="Thème clair ou sombre">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2v14a7 7 0 0 1 0-14z"/></svg>
    </button>
    <button class="mode" id="mode" aria-label="Passer de la tenue horizontale à la verticale">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    </button>
    <button class="pad" id="pad" aria-label="Croix ou joystick">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
    </button>
    <div class="dpad" role="group" aria-label="Croix directionnelle">
      <button data-dir="up" aria-label="Haut"></button>
      <button data-dir="left" aria-label="Gauche"></button>
      <button data-dir="right" aria-label="Droite"></button>
      <button data-dir="down" aria-label="Bas"></button>
    </div>
    <div class="joystick" id="joystick" aria-label="Joystick"><i></i></div>
    <button class="a" data-btn="A">A</button>
    <button class="b" data-btn="B">B</button>
    <button class="minus" data-btn="-" aria-label="Moins">−</button>
    <button class="home" data-btn="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
    </button>
    <button class="plus" data-btn="+" aria-label="Plus">+</button>
    <button class="one" data-btn="1">1</button>
    <button class="two" data-btn="2">2</button>
    <button class="shake" data-btn="Shake" aria-label="Secouer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12l3-5 4 10 4-10 4 10 3-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="leds" aria-label="Numéro de joueur"><i></i><i></i><i></i><i></i></div>
    <button class="recenter" id="aim" aria-label="Calibrer le pointeur sur les coins de l'écran">⌖</button>
  </main>

  <div class="overlay" id="overlay">
    <h1>Wiimote<i>.</i></h1>
    <p id="status">Tenue horizontale pour Mario Kart. Le bouton ⟲ en haut à droite passe à la verticale, pour pointer l'écran.</p>
    <video id="camera" playsinline muted hidden></video>
    <input id="name" class="name" maxlength="24" placeholder="Ton prénom" autocomplete="nickname" enterkeyhint="go" aria-label="Ton prénom, affiché à l'hôte" hidden>
    <button class="start" id="start">Connecter</button>
    <button class="start" id="scan" hidden>Scanner le QR code</button>
  </div>
</div>
</body>
</html>
