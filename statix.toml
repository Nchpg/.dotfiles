# Lints statix désactivés — choix de style assumés du repo :
# - repeated_keys : les chemins pointés (boot.loader.x, services.y) sont la
#   convention NixOS, plus lisibles que des blocs imbriqués pour 2-3 clés.
# - empty_pattern : `{ ... }:` est la signature conventionnelle d'un module
#   (montre qu'il en est un), on ne la remplace pas par `_:`.
# - manual_inherit_from : faux positif sur `foo = "${bar.baz}/suffixe";` —
#   statix flague l'accesseur MÊME quand il n'est qu'un composant d'une
#   chaîne plus longue (pas la valeur entière), et re-déclenche même après un
#   `inherit` local (cf. modules/user/{claude,vscode}/default.nix : targetPath
#   construit un chemin par interpolation, ce n'est pas un candidat inherit).
disabled = ["repeated_keys", "empty_pattern", "manual_inherit_from"]
