name: check

# push limité à main : les branches de PR sont déjà couvertes par l'event
# pull_request (sinon chaque job tournait deux fois sur le runner).
on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur la même branche/PR annule les runs obsolètes
# (runner self-hosted : évite d'empiler des jobs devenus inutiles).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Token GitHub frais à chaque run : le runner self-hosted garde dans son
  # nix.conf l'`access-tokens` gravé par l'installeur, un GITHUB_TOKEN qui
  # expire en une heure. Sans ce reset, les résolutions d'inputs `github:`
  # partent avec un token mort (401 « Bad credentials »). NIX_CONFIG a
  # priorité sur les fichiers de conf.
  NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"

jobs:
  fmt:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      # Vérifie que tout est passé par `nix fmt` (le hook pre-commit le fait
      # en local, ceci rattrape les commits faits avec --no-verify).
      # hardware-configuration.nix est exclu (fichier généré).
      - name: check formatting
        run: |
          git ls-files '*.nix' ':!:*hardware-configuration.nix' \
            | xargs nix fmt -- --check

  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      # Anti-patterns Nix (lints désactivés : voir statix.toml, qui n'était
      # jusqu'ici exécuté nulle part).
      - name: statix
        run: nix run nixpkgs#statix -- check .

      # Code mort Nix (bindings inutilisés, arguments de pattern jamais lus).
      # hardware-configuration.nix est exclu (fichier généré, comme pour fmt).
      - name: deadnix
        run: |
          git ls-files '*.nix' ':!:*hardware-configuration.nix' \
            | xargs nix run nixpkgs#deadnix -- --fail

  security:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : gitleaks scanne tous les commits, pas
          # seulement le dernier (un secret committé puis retiré fuit quand même).
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v22

      # Détection de secrets en clair (les secrets sops chiffrés ne le
      # déclenchent pas — vérifié).
      - name: gitleaks
        run: nix run nixpkgs#gitleaks -- detect --source . --no-banner --redact

      # Santé du flake.lock : nixpkgs sur une branche supportée et pas trop
      # vieux (donc patchs de sécu récents). Informatif, ne bloque pas.
      - name: flake lock health
        uses: DeterminateSystems/flake-checker-action@v12
        with:
          fail-mode: false
          # Nos inputs nixpkgs ne s'appellent pas `nixpkgs` (défaut de l'action).
          nixpkgs-keys: nixpkgs-stable,nixpkgs-unstable

  flake-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: nix flake check
        run: nix flake check --no-build

      # Construit réellement chaque nixosConfiguration (auto-découvertes, donc
      # pas de liste en dur ici non plus) : contrairement à un --dry-run, ça
      # attrape aussi les erreurs de BUILD (ex. hash de l'overlay displaylink
      # cassé par un bump nixpkgs), pas seulement les erreurs d'éval. Bonus sur
      # runner self-hosted : le store local est pré-rempli, le rebuild sur
      # machine après merge est quasi instantané.
      - name: build all nixosConfigurations
        run: |
          for cfg in $(nix eval .#nixosConfigurations --apply builtins.attrNames --json | jq -r '.[]'); do
            echo "::group::$cfg"
            nix build ".#nixosConfigurations.$cfg.config.system.build.toplevel" --no-link
            echo "::endgroup::"
          done

      # Idem côté devshells (auto-découverts depuis devshells/, cf. flake.nix) :
      # attrape une régression dans un devShells.<system>.<nom> sans attendre
      # qu'un `nix develop` échoue sur machine.
      - name: build all devShells
        run: |
          for name in $(nix eval .#devShells.x86_64-linux --apply builtins.attrNames --json | jq -r '.[]'); do
            echo "::group::$name"
            nix build ".#devShells.x86_64-linux.$name" --no-link
            echo "::endgroup::"
          done

      # Réalise TOUTES les fetchurl du registre de fonds d'écran
      # (modules/themes/wallpapers.nix). Les builds ci-dessus ne téléchargent
      # que les fonds des thèmes ACTIFS : une URL morte, ou un contenu
      # republié sous la même URL, ne se découvrirait qu'en sélectionnant le
      # thème concerné. `--keep-going` pour lister TOUS les fonds cassés d'un
      # coup au lieu de s'arrêter au premier.
      #
      # Non bloquant (comme flake lock health) : ces 56 URLs sont tierces et
      # éphémères, un fond retiré en amont ne doit pas bloquer un merge qui
      # n'a rien à voir. L'annotation suffit à savoir quoi corriger.
      - name: build all wallpapers
        continue-on-error: true
        run: nix build .#wallpapers-all --no-link --keep-going
