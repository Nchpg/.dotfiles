name: check

# `weekly-update` explicite : sa PR est ouverte avec le GITHUB_TOKEN par défaut, dont les événements ne déclenchent aucun workflow.
on:
  push:
    branches: [main, weekly-update]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `trusted` est un garde de sécurité : une PR de fork exécuterait du Nix arbitraire sur le runner self-hosted (identités age).
# Ne retirer qu'avec un runner jetable.
jobs:
  trusted:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - run: echo "code interne au dépôt, jobs self-hosted autorisés"

  fmt:
    runs-on: self-hosted
    needs: trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./.github/actions/setup-nix

      - name: check formatting
        run: |
          git ls-files -z '*.nix' ':!:*hardware-configuration.nix' \
            | xargs -r0 nix fmt -- --check

  lint:
    runs-on: self-hosted
    needs: trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./.github/actions/setup-nix

      - name: statix
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        run: |
          git ls-files -z '*.nix' ':!:*hardware-configuration.nix' \
            | xargs -r0 nix run nixpkgs#deadnix -- --fail

      - name: shellcheck
        run: |
          git ls-files -z '*.sh' '.githooks/*' \
            | xargs -r0 nix run nixpkgs#shellcheck --

      # Les chemins modules/… en dur dans les scripts échappent aux linters : on vérifie que chaque littéral existe.
      - name: chemins de modules en dur
        run: |
          rc=0
          while read -r p; do
            [ -e "$p" ] || { echo "::error::chemin mort dans un script : $p"; rc=1; }
          done < <(
            git grep -hE 'modules/[A-Za-z0-9._/-]+\.(json|sh|nix|js|py)' \
              -- '*.sh' '*.yml' '.githooks/*' \
              | grep -vE '^[[:space:]]*#' \
              | grep -ohE 'modules/[A-Za-z0-9._/-]+\.(json|sh|nix|js|py)' \
              | sort -u
          )
          exit $rc

  security:
    runs-on: self-hosted
    needs: trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nix

      - name: gitleaks
        run: nix run nixpkgs#gitleaks -- detect --source . --no-banner --redact

      - name: flake lock health
        uses: DeterminateSystems/flake-checker-action@3164002371bc90729c68af0e24d5aacf20d7c9f6 # v12
        with:
          fail-mode: false
          nixpkgs-keys: nixpkgs-stable,nixpkgs-unstable

  flake-check:
    runs-on: self-hosted
    needs: trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./.github/actions/setup-nix

      - name: nix flake check
        run: nix flake check --no-build

      - name: build all nixosConfigurations
        run: |
          for cfg in $(nix eval .#nixosConfigurations --apply builtins.attrNames --json | jq -r '.[]'); do
            echo "::group::$cfg"
            nix build ".#nixosConfigurations.$cfg.config.system.build.toplevel" --no-link
            echo "::endgroup::"
          done

      - name: build all devShells
        run: |
          for name in $(nix eval .#devShells.x86_64-linux --apply builtins.attrNames --json | jq -r '.[]'); do
            echo "::group::$name"
            nix build ".#devShells.x86_64-linux.$name" --no-link
            echo "::endgroup::"
          done

      # Non bloquant : URLs tierces.
      - name: build all wallpapers
        continue-on-error: true
        run: nix build .#wallpapers-all --no-link --keep-going
