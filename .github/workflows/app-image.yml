name: app-image

# Workflow partagé des apps servies par think (cf. docs/apps.md) : construit l'image, la contrôle
# (jamais root, port >= 1024) et ne la publie sur ghcr.io qu'ensuite. Rien d'autre à faire :
# think repère le nouveau tag dans la minute et en demande l'épinglage (apps.yml).
#
# Appel, dans le dépôt de l'app :
#   jobs:
#     image:
#       uses: Nchpg/.dotfiles/.github/workflows/app-image.yml@main
#       with:
#         images: '[{"name": "monapp"}]'
#       permissions: { contents: read, packages: write }
on:
  workflow_call:
    inputs:
      images:
        description: >
          JSON [{"name": <package ghcr>, "dockerfile": <défaut <context>/Dockerfile>, "context": <défaut .>}]
        required: true
        type: string
      tag:
        description: Tag mobile publié, celui que suit think
        required: false
        type: string
        default: main
      allow-root:
        description: Accepter une image qui tourne en root (à éviter ; cf. docs/apps.md)
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # ghcr.io refuse les majuscules (propriétaire `Nchpg`).
      - name: référence
        id: ref
        env:
          NAME: ${{ matrix.image.name }}
          TAG: ${{ inputs.tag }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$repo:$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construite et chargée d'abord : l'image n'est publiée qu'après le contrôle.
      # `scope` par image : sans lui, deux images d'un même dépôt invalident mutuellement leur cache.
      - name: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile || format('{0}/Dockerfile', matrix.image.context || '.') }}
          load: true
          tags: ${{ steps.ref.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      # Règles de think (docs/apps.md) : jamais root, port au-dessus de 1024 (pas de droit root à rendre).
      # Le port de l'`EXPOSE` part dans le lock : think s'en sert comme port du conteneur.
      - name: contrôle
        id: check
        env:
          REF: ${{ steps.ref.outputs.ref }}
          ALLOW_ROOT: ${{ inputs.allow-root }}
        run: |
          config=$(docker image inspect "$REF" --format '{{json .Config}}')
          user=$(jq -r '.User // ""' <<<"$config")
          port=$(jq '[.ExposedPorts // {} | keys[] | select(endswith("/tcp")) | rtrimstr("/tcp") | tonumber]
                     | if length == 1 then .[0] else null end' <<<"$config")
          echo "port=$port" >> "$GITHUB_OUTPUT"

          fail=0
          case "${user%%:*}" in
            "" | root | 0)
              if [ "$ALLOW_ROOT" = true ]; then
                echo "::warning::l'image tourne en root (allow-root)."
              else
                echo "::error::l'image tourne en root : ajoute un utilisateur au Dockerfile (ex. \`RUN useradd --uid 1000 app\` puis \`USER app\`), ou \`allow-root: true\`."
                fail=1
              fi
              ;;
          esac
          if [ "$port" = null ]; then
            echo "::warning::aucun EXPOSE unique : il faudra donner son \`port\` au conteneur dans apps.nix."
          elif [ "$port" -lt 1024 ]; then
            echo "::error::port $port sous 1024 : il exige un droit root. Écoute sur 8080 ou plus (pour nginx : nginxinc/nginx-unprivileged)."
            fail=1
          fi
          exit "$fail"

      # Dépôt privé, package privé : un package créé par la CI l'est par défaut, ceci rattrape un
      # passage en public fait à la main. Package encore inexistant ou API muette : pas de blocage.
      - name: visibilité
        if: github.event.repository.private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ matrix.image.name }}
        run: |
          visibility=$(gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/${NAME,,}" --jq .visibility 2>/dev/null) \
            || { echo "::notice::visibilité du package illisible (nouveau package ?), il sera privé par défaut."; exit 0; }
          if [ "$visibility" != private ]; then
            echo "::error::le dépôt est privé mais le package ghcr ${NAME,,} est $visibility : repasse-le en privé (Package settings → Change visibility)."
            exit 1
          fi

      # Même builder : tout vient du cache de l'étape `build`.
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile || format('{0}/Dockerfile', matrix.image.context || '.') }}
          push: true
          tags: |
            ${{ steps.ref.outputs.ref }}
            ${{ steps.ref.outputs.repo }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.name }}

      # Les images d'un dépôt portent le même commit (label `revision`) : think attend qu'elles
      # soient toutes publiées avant de les épingler ensemble.
      - name: résumé
        env:
          REF: ${{ steps.ref.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PORT: ${{ steps.check.outputs.port }}
        run: echo "\`$REF\` → \`$DIGEST\`, port \`$PORT\`" >> "$GITHUB_STEP_SUMMARY"
