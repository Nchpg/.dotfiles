name: apps

# Seul chemin d'écriture des sites sur main, déclenché par think avec son jeton « Actions » :
# - pin  : apps-watch a vu une nouvelle image, son digest entre dans le lock ;
# - edit : le dashboard modifie, ajoute ou supprime un site dans apps.json (et le lock) ;
# - peer : le dashboard inscrit ou retire un appareil VPN dans vpn-peers.json (autorisé seulement une
#   fois sa clé pré-partagée dans les secrets, puis un rebuild à la main) ;
# - access : le dashboard change les accès d'un appareil (services de think dans vpn-peers.json, sites
#   en VPN dans apps.json), en un commit, appliqué seul par think (apps-deploy) ;
# - account : le dashboard change les accès d'un compte Authelia (services de think dans
#   authelia-accounts.json, sites avec Authelia dans apps.json), en un commit, appliqué seul aussi.
# think applique seul ces commits (apps-deploy), sauf l'ajout ou le retrait d'un appareil VPN.
# Pas d'évaluation Nix ici (elle demanderait le dépôt de secrets) : le dashboard évalue avant
# d'appeler, et apps.sh vérifie chaque entrée.
# Runner GitHub et non self-hosted : il doit passer même machine éteinte.
on:
  workflow_dispatch:
    inputs:
      action:
        description: pin, edit, peer, access ou account
        required: true
        type: choice
        options:
          - pin
          - edit
          - peer
          - access
          - account
      images:
        description: 'JSON [{"ref": "ghcr.io/…:tag", "digest": "sha256:…", "revision": "<sha>", "port": 8080}]'
        required: false
        default: "[]"
        type: string
      app:
        description: "edit : nom du site ; peer, access : nom de l'appareil ; account : nom du compte"
        required: false
        type: string
      entry:
        description: "edit : entrée JSON du site ; peer : {publicKey, address, services} ; access : {services, sites} ; account : {services, sites, all} ; null pour retirer"
        required: false
        type: string
      base:
        description: "edit : empreinte de l'entrée lue par la page (new si absente)"
        required: false
        type: string
      message:
        description: "edit : message de commit (facultatif)"
        required: false
        type: string
      source:
        description: Origine de la demande (think, dashboard)
        required: false
        type: string

# Les appels s'enchaînent sans s'annuler : deux demandes donnent deux commits.
concurrency:
  group: apps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main

      # Entrées par l'environnement, jamais interpolées dans le script (injection de commande).
      # Si main bouge pendant le run, tout est refait sur la nouvelle tête : l'empreinte est
      # revérifiée, jamais un rebase qui fusionnerait en silence une modification concurrente.
      - name: écrire et pousser
        env:
          ACTION: ${{ inputs.action }}
          IMAGES: ${{ inputs.images }}
          APP: ${{ inputs.app }}
          ENTRY: ${{ inputs.entry }}
          BASE: ${{ inputs.base }}
          MESSAGE: ${{ inputs.message }}
          SOURCE: ${{ inputs.source }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Une ligne, sans retour : le texte libre ne doit pas former une commande de workflow (`::…`).
          source=${SOURCE:-inconnu}
          echo "$ACTION, appel de ${source//$'\n'/ }"
          export REGISTRY="ghcr.io/${OWNER,,}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            out=$(.github/scripts/apps.sh "$ACTION")
            subject=$(sed -n 's/^subject=//p' <<< "$out")
            if [ -z "$subject" ]; then
              echo "rien à changer"
              exit 0
            fi
            git add -- profiles/server/vpn-peers.json profiles/server/authelia-accounts.json 2> /dev/null || true
            git commit --quiet -m "$subject" -- profiles/server/apps.json profiles/server/apps.lock.json profiles/server/vpn-peers.json profiles/server/authelia-accounts.json
            if git push --quiet origin HEAD:main; then
              echo "### $subject" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::push refusé (essai $attempt), nouvel essai sur la nouvelle tête de main"
          done
          echo "::error::push impossible après trois essais"
          exit 1
