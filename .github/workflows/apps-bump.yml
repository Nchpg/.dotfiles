name: apps-bump

# Déclenché par think (apps-watch) quand une image a changé : épingle ses digests en un seul
# commit sur main, que comin déploie dans la minute. Un workflow_dispatch exige déjà le droit
# d'écriture sur ce dépôt.
# Runner GitHub et non self-hosted : il doit passer même machine éteinte. Pas d'évaluation ici
# (elle demanderait le dépôt de secrets) : apps-bump.sh vérifie chaque entrée, et comin refuse
# de déployer un commit qui ne s'évalue pas (alerte DeploiementEnEchec).
on:
  workflow_dispatch:
    inputs:
      images:
        description: 'JSON [{"ref": "ghcr.io/…:main", "digest": "sha256:…", "revision": "<sha>"}]'
        required: true
        type: string
      source:
        description: Origine de la demande (think, ou un dépôt d'app)
        required: false
        type: string

# Les appels s'enchaînent sans s'annuler : deux apps poussées ensemble donnent deux commits.
concurrency:
  group: apps-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main

      # Entrées par l'environnement, jamais interpolées dans le script (injection de commande).
      - name: lock
        id: lock
        env:
          IMAGES: ${{ inputs.images }}
          SOURCE: ${{ inputs.source }}
        run: |
          echo "appel de ${SOURCE:-inconnu}"
          .github/scripts/apps-bump.sh profiles/server/apps.lock.json >> "$GITHUB_OUTPUT"

      # Rebase et nouvel essai si main a bougé entre-temps (push humain).
      - name: commit et push
        if: steps.lock.outputs.subject != ''
        env:
          SUBJECT: ${{ steps.lock.outputs.subject }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$SUBJECT" -- profiles/server/apps.lock.json
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "### $SUBJECT" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::push refusé (essai $attempt), rebase sur main"
            git pull --rebase origin main
          done
          echo "::error::push impossible après trois essais"
          exit 1
