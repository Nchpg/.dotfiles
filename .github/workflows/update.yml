name: weekly-update

# Bump hebdomadaire de TOUS les inputs flake (claude-code inclus) + des
# extensions VS Code (extensions.json), puis ouverture d'une PR listant, par
# input, les dates avant/après, le nombre de commits et un lien de
# comparaison GitHub, avec alerte si la version du noyau change. Rendu 100%
# déterministe (pas de LLM) : aucun contenu de commit n'est résumé ni
# interprété. Ne merge jamais automatiquement : le job `check` tourne sur la
# PR comme sur n'importe quelle branche. Notifie Discord (succès ou échec) à
# la fin du run.
on:
  schedule:
    - cron: "0 6 * * 1"  # lundi 06:00 UTC
  workflow_dispatch: {}

# Runner self-hosted en locale française : create-pull-request compare la
# sortie de `git stash push` à la chaîne anglaise "No local changes to save",
# croit qu'un stash existe, et son `git stash pop` échoue (« Aucune entrée de
# remisage trouvée »). Git en anglais règle ça pour tous les steps.
env:
  LC_ALL: C.UTF-8

  # Token GitHub frais à chaque run. Sans ça, Nix réutilise l'`access-tokens`
  # que l'installeur a gravé dans le nix.conf PERSISTANT du runner
  # self-hosted : un GITHUB_TOKEN qui expire au bout d'une heure. Tous les
  # runs suivants envoient donc un token mort → 401 sur api.github.com, et
  # `nix flake update` retombe en silence sur « using cached version ».
  # Symptôme observé : job vert, PR créée, et zéro input réellement bumpé
  # pendant plus d'une semaine. NIX_CONFIG a priorité sur les fichiers de conf.
  NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: snapshot avant bump
        run: |
          cp flake.lock /tmp/flake.lock.before
          cp modules/user/vscode/extensions.json /tmp/extensions.json.before

      # `nix flake update` traite un échec de résolution d'input en WARNING :
      # il retombe sur « using cached version », n'écrit rien, et sort en 0.
      # Le job passe donc au vert en n'ayant rien bumpé (vécu : 9 jours de MAJ
      # hebdo fantômes sur un token expiré). On échoue explicitement.
      # `set -o pipefail` indispensable : sans lui le code de retour serait
      # celui de `tee`, et un vrai échec de `nix flake update` serait masqué.
      - name: bump des inputs flake
        run: |
          set -o pipefail
          nix flake update 2>&1 | tee /tmp/update.log
          if grep -q "unable to download" /tmp/update.log; then
            echo "::error::résolution d'input échouée — le lock n'a peut-être pas été mis à jour"
            exit 1
          fi

      - name: bump des extensions vscode
        run: MY_FLAKE="$PWD" bash modules/user/vscode/update-extensions.sh

      - name: rassembler les faits (rev + nombre de commits par input)
        id: facts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/gather-update-facts.sh \
            /tmp/flake.lock.before flake.lock \
            /tmp/extensions.json.before modules/user/vscode/extensions.json \
            > /tmp/facts.json
          changed=$(jq '(.flakeInputs | length) > 0 or (.vscodeExtensions | length) > 0' /tmp/facts.json)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: générer le corps de la PR
        if: steps.facts.outputs.changed == 'true'
        run: .github/scripts/render-pr-body.sh /tmp/facts.json > /tmp/pr-body.md

      - name: créer la PR
        id: create-pr
        if: steps.facts.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: weekly flake + vscode extensions update"
          branch: weekly-update
          delete-branch: true
          title: "chore: weekly flake + vscode extensions update"
          body-path: /tmp/pr-body.md

      - name: notifier Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          STATUS: ${{ job.status }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_BODY_FILE: /tmp/pr-body.md
          FACTS_FILE: /tmp/facts.json
        run: .github/scripts/notify-discord.sh
