name: weekly-update

# PR ouverte avec le GITHUB_TOKEN par défaut (aucun workflow déclenché) : les checks viennent du `push`
# sur `weekly-update` dans check.yml. Ne pas le retirer sans passer create-pull-request sur un PAT.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-update
  cancel-in-progress: false

# create-pull-request compare la sortie de `git stash push` à la chaîne anglaise : git en anglais.
env:
  LC_ALL: C.UTF-8

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./.github/actions/setup-nix

      # `nix flake update` sort en 0 sur un échec de résolution (WARNING) : échec explicite ; pipefail pour ne pas masquer l'échec derrière `tee`.
      - name: bump des inputs flake
        run: |
          set -o pipefail
          . scripts/lib/flake-lock.sh
          mapfile -t inputs < <(fl_bumpable_inputs flake.lock)
          nix flake update "${inputs[@]}" 2>&1 | tee "${RUNNER_TEMP}"/update.log
          if grep -q "unable to download" "${RUNNER_TEMP}"/update.log; then
            echo "::error::résolution d'input échouée — le lock n'a peut-être pas été mis à jour"
            exit 1
          fi

      - name: bump des modules (update.sh auto-découverts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export MY_FLAKE="$PWD"
          export VSCODE_SKIPPED_FILE="${RUNNER_TEMP}"/extensions-skipped.json
          . scripts/lib/flake-lock.sh
          while IFS= read -r -d '' script; do
            echo "⬆️  Running $script..."
            "$script" || echo "::warning::$script en échec — état précédent conservé."
          done < <(fl_module_updaters)

      - name: rassembler les faits (rev + nombre de commits par input)
        id: facts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/gather-update-facts.sh "${RUNNER_TEMP}"/extensions-skipped.json \
            > "${RUNNER_TEMP}"/facts.json
          changed=$(jq '(.flakeInputs | length) > 0 or (.pinnedUpdates | length) > 0 or (.vscodeExtensions | length) > 0' "${RUNNER_TEMP}"/facts.json)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: générer le corps de la PR
        if: steps.facts.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/render-pr-body.sh "${RUNNER_TEMP}"/facts.json > "${RUNNER_TEMP}"/pr-body.md
          .github/scripts/expiring-workarounds.sh >> "${RUNNER_TEMP}"/pr-body.md \
            || echo "::warning::expiring-workarounds.sh en échec — section omise."

      - name: créer la PR
        id: create-pr
        if: steps.facts.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "chore: weekly flake + pinned modules update"
          branch: weekly-update
          delete-branch: true
          title: "chore: weekly flake + pinned modules update"
          body-path: ${{ runner.temp }}/pr-body.md

      - name: notifier Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          STATUS: ${{ job.status }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          FACTS_FILE: ${{ runner.temp }}/facts.json
        run: .github/scripts/notify-discord.sh
