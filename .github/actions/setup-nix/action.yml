name: setup-nix
description: >
  Nix sur le runner self-hosted, avec un jeton GitHub frais et les caches
  binaires du dépôt. Commun à check.yml et update.yml. Le checkout reste dans
  chaque job : une action locale ne se lit qu'une fois le dépôt extrait.

runs:
  using: composite
  steps:
    # Token frais à chaque run : sinon Nix réutilise l'`access-tokens` expiré du nix.conf persistant et
    # `nix flake update` retombe sur « using cached version » (job vert, rien de bumpé).
    # Caches posés ici et non en `nixConfig` : garder alignés avec nix.settings (modules/system/configuration.nix).
    - name: NIX_CONFIG
      shell: bash
      env:
        TOKEN: ${{ github.token }}
      run: |
        {
          echo "NIX_CONFIG<<NIX_CONFIG_EOF"
          echo "access-tokens = github.com=$TOKEN"
          echo "extra-substituters = https://claude-code.cachix.org https://ros.cachix.org"
          echo "extra-trusted-public-keys = claude-code.cachix.org-1:YeXf2aNu7UTX8Vwrze0za1WEDS+4DuI2kVeWEE4fsRk= ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo="
          echo "NIX_CONFIG_EOF"
        } >> "$GITHUB_ENV"

    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
