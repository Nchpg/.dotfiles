# Regles de chiffrement sops. La cle publique age ci-dessous est derivee de la
# cle SSH ed25519 de chaque machine (via `ssh-to-age < ~/.ssh/id_ed25519.pub`).
# Pour enroler un 2e PC : ajouter sa cle publique sous `keys`, l'ajouter au
# key_group, puis `sops updatekeys secrets/secrets.yaml` depuis un PC autorise.
keys:
  - &gram age1jauxanxn3mwgr42hl0x7vnq0cs4yurj8z7amhnuz7hapug0fu9ks3g3862
  - &think age1wp8859hacw4yfc6er8dkk2zgjr4tr886kxetenxfvmd4pca5qqcqm8qkx2
creation_rules:
  - path_regex: secrets/.*\.ya?ml$
    key_groups:
      - age:
          - *gram
